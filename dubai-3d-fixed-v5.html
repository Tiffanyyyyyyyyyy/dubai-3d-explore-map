        function buildHeliNodes() {
            // ARCHITECTURE NOTE: every LFO here modulates an INNER gain stage, and start/stop/mute
            // only ever ramp the outer MASTER gains. Web Audio param connections SUM (they don't
            // multiply), so the previous design — LFOs wired straight onto the master gains —
            // left a residual ±depth oscillation audible even after ramping the master to 0.
            // Chaining inner(LFO) -> master(ramp) multiplies the two stages, so master = 0 is
            // genuinely silent in Explore mode / on mute / when switching tours.

            // Low engine rumble (sub-bass; desktop-focused).
            const osc = audioCtx.createOscillator(); const lowpass = audioCtx.createBiquadFilter(); const gainNode = audioCtx.createGain();
            osc.type = "sawtooth"; osc.frequency.setValueAtTime(15, audioCtx.currentTime);
            lowpass.type = "lowpass"; lowpass.frequency.setValueAtTime(110, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            osc.connect(lowpass); lowpass.connect(gainNode); gainNode.connect(audioCtx.destination); osc.start();

            // Shared blade-pass LFO: a 12Hz square wave gates the layers below on/off, which is
            // the recognisable "whup-whup-whup" rotor rhythm.
            const chopLFO = audioCtx.createOscillator();
            chopLFO.type = "square"; chopLFO.frequency.setValueAtTime(12, audioCtx.currentTime);
            chopLFO.start();

            // Rotor tone (audible on phone speakers, which roll off below ~150Hz).
            const rotorOsc = audioCtx.createOscillator();
            rotorOsc.type = "square"; rotorOsc.frequency.setValueAtTime(85, audioCtx.currentTime);
            const rotorTrem = audioCtx.createGain(); rotorTrem.gain.setValueAtTime(0.6, audioCtx.currentTime);
            const rotorTremDepth = audioCtx.createGain(); rotorTremDepth.gain.setValueAtTime(0.4, audioCtx.currentTime);
            chopLFO.connect(rotorTremDepth); rotorTremDepth.connect(rotorTrem.gain);
            const rotorGain = audioCtx.createGain(); rotorGain.gain.setValueAtTime(0, audioCtx.currentTime);
            rotorOsc.connect(rotorTrem); rotorTrem.connect(rotorGain); rotorGain.connect(audioCtx.destination); rotorOsc.start();

            // Blade slap: broadband noise gated hard by the same LFO — the percussive "chop".
            const slapBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const slapData = slapBuffer.getChannelData(0);
            for (let i = 0; i < slapData.length; i++) slapData[i] = Math.random() * 2 - 1;
            const slapSource = audioCtx.createBufferSource();
            slapSource.buffer = slapBuffer; slapSource.loop = true;
            const slapFilter = audioCtx.createBiquadFilter();
            slapFilter.type = "bandpass"; slapFilter.frequency.setValueAtTime(320, audioCtx.currentTime); slapFilter.Q.setValueAtTime(1.0, audioCtx.currentTime);
            const slapInner = audioCtx.createGain(); slapInner.gain.setValueAtTime(0.5, audioCtx.currentTime);
            const slapDepth = audioCtx.createGain(); slapDepth.gain.setValueAtTime(0.5, audioCtx.currentTime);
            chopLFO.connect(slapDepth); slapDepth.connect(slapInner.gain);
            const chopGain = audioCtx.createGain(); chopGain.gain.setValueAtTime(0, audioCtx.currentTime);
            slapSource.connect(slapFilter); slapFilter.connect(slapInner); slapInner.connect(chopGain); chopGain.connect(audioCtx.destination); slapSource.start();

            // Subtle wind: thin highpass hiss, clearly distinct from the yacht's soft low wash.
            const windBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const windData = windBuffer.getChannelData(0);
            for (let i = 0; i < windData.length; i++) windData[i] = Math.random() * 2 - 1;
            const windSource = audioCtx.createBufferSource();
            windSource.buffer = windBuffer; windSource.loop = true;
            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = "highpass"; windFilter.frequency.setValueAtTime(1400, audioCtx.currentTime);
            const windGain = audioCtx.createGain();
            windGain.gain.setValueAtTime(0, audioCtx.currentTime);
            windSource.connect(windFilter); windFilter.connect(windGain); windGain.connect(audioCtx.destination); windSource.start();

            return { gainNode, rotorGain, chopGain, windGain };
        }

        function buildYachtNodes() {
            // Sea-waves sailing ambience (ASMR-calm): lowpassed noise with a deep, slow amplitude
            // swell — nothing tonal, so it can never be mistaken for the helicopter. Same
            // inner(LFO) -> master(ramp) multiplicative chain as the heli (see note there) so
            // stop/mute is genuinely silent.
            const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer; noiseSource.loop = true;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = "lowpass"; noiseFilter.frequency.setValueAtTime(750, audioCtx.currentTime);

            // Slow drift of the cutoff keeps the wash "moving" (a filter param — silent when the master is 0).
            const cutoffLFO = audioCtx.createOscillator(); const cutoffDepth = audioCtx.createGain();
            cutoffLFO.type = "sine"; cutoffLFO.frequency.setValueAtTime(0.12, audioCtx.currentTime);
            cutoffDepth.gain.setValueAtTime(220, audioCtx.currentTime);
            cutoffLFO.connect(cutoffDepth); cutoffDepth.connect(noiseFilter.frequency); cutoffLFO.start();

            // Deep, slow breathing swell — the wave rhythm itself.
            const swellInner = audioCtx.createGain(); swellInner.gain.setValueAtTime(0.55, audioCtx.currentTime);
            const swellDepth = audioCtx.createGain(); swellDepth.gain.setValueAtTime(0.45, audioCtx.currentTime);
            const swellLFO = audioCtx.createOscillator();
            swellLFO.type = "sine"; swellLFO.frequency.setValueAtTime(0.08, audioCtx.currentTime);
            swellLFO.connect(swellDepth); swellDepth.connect(swellInner.gain); swellLFO.start();

            const waveGain = audioCtx.createGain();
            waveGain.gain.setValueAtTime(0, audioCtx.currentTime);
            noiseSource.connect(noiseFilter); noiseFilter.connect(swellInner); swellInner.connect(waveGain); waveGain.connect(audioCtx.destination); noiseSource.start();

            // Light wind: soft dull lowpass layer with its own gentle drift.
            const windBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const windData = windBuffer.getChannelData(0);
            for (let i = 0; i < windData.length; i++) windData[i] = Math.random() * 2 - 1;
            const windSource = audioCtx.createBufferSource();
            windSource.buffer = windBuffer; windSource.loop = true;
            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = "lowpass"; windFilter.frequency.setValueAtTime(500, audioCtx.currentTime);
            const windInner = audioCtx.createGain(); windInner.gain.setValueAtTime(0.7, audioCtx.currentTime);
            const windLfoDepth = audioCtx.createGain(); windLfoDepth.gain.setValueAtTime(0.3, audioCtx.currentTime);
            const windLfoOsc = audioCtx.createOscillator();
            windLfoOsc.type = "sine"; windLfoOsc.frequency.setValueAtTime(0.07, audioCtx.currentTime);
            windLfoOsc.connect(windLfoDepth); windLfoDepth.connect(windInner.gain); windLfoOsc.start();
            const windGain = audioCtx.createGain();
            windGain.gain.setValueAtTime(0, audioCtx.currentTime);
            windSource.connect(windFilter); windFilter.connect(windInner); windInner.connect(windGain); windGain.connect(audioCtx.destination); windSource.start();

            return { waveGain, windGain };
        }

        function rampGainTo(node, value, seconds) {
            if (node && audioCtx) node.gain.linearRampToValueAtTime(value, audioCtx.currentTime + seconds);
        }

        function stopTourAudio(tourType, fast) {
            const dur = fast ? 0.15 : 0.5;
            if (tourType === 'heli' && heliNodes) { rampGainTo(heliNodes.gainNode, 0, dur); rampGainTo(heliNodes.rotorGain, 0, dur); rampGainTo(heliNodes.chopGain, 0, dur); rampGainTo(heliNodes.windGain, 0, dur); }
            if (tourType === 'yacht' && yachtNodes) { rampGainTo(yachtNodes.waveGain, 0, dur); rampGainTo(yachtNodes.windGain, 0, dur); }
        }

        function setAudioPlayback(start) {
            const tourType = activeTourType; // 'heli' | 'yacht' — read at call time so Pause/Mute/Exit always affect whichever tour is current
            if (start && !isMuted) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Required mobile unlock: playing a silent buffer synchronously inside this tap
                // reliably unlocks the hardware audio output on iOS Safari (resume() alone is not
                // always sufficient). Errors here are logged, not swallowed, per requirement.
                try {
                    const silentBuffer = audioCtx.createBuffer(1, 1, 22050);
                    const silentSource = audioCtx.createBufferSource();
                    silentSource.buffer = silentBuffer;
                    silentSource.connect(audioCtx.destination);
                    silentSource.start(0);
                } catch (err) {
                    console.error('Audio unlock (silent buffer) failed:', err);
                }

                // Nodes are created/reused only AFTER resume() actually resolves — starting audio
                // on a still-suspended context is unreliable on mobile, and scheduling gain ramps
                // before resume() resolves reads a stale, frozen currentTime.
                Promise.resolve(audioCtx.resume()).then(() => {
                    // Switching tours: stop the previous tour's sound before starting the new one,
                    // so helicopter and yacht audio never play together.
                    if (activeAudioTour && activeAudioTour !== tourType) stopTourAudio(activeAudioTour, true);
                    activeAudioTour = tourType;

                    if (tourType === 'heli') {
                        if (!heliNodes) heliNodes = buildHeliNodes();
                        if (!isMuted) { rampGainTo(heliNodes.gainNode, 0.25, 1.0); rampGainTo(heliNodes.rotorGain, 0.055, 1.0); rampGainTo(heliNodes.chopGain, 0.10, 1.0); rampGainTo(heliNodes.windGain, 0.025, 1.0); }
                    } else {
                        if (!yachtNodes) yachtNodes = buildYachtNodes();
                        if (!isMuted) { rampGainTo(yachtNodes.waveGain, 0.22, 1.2); rampGainTo(yachtNodes.windGain, 0.05, 1.2); }
                    }
                }).catch(err => {
                    console.error('Audio resume failed:', err); // surfaced, not silently swallowed
                });
            } else {
                stopTourAudio('heli', false);
                stopTourAudio('yacht', false);
            }
        }

        // --- INTERACTION HUD GENERATION ENGINE ---
        function buildUI() {
            const list = document.getElementById('menu-list');
            const labelsContainer = document.getElementById('labels-container');

            LANDMARKS_CONFIG.forEach(cfg => {
                const li = document.createElement('li');
                li.className = 'menu-item'; li.dataset.id = cfg.id;
                li.innerHTML = `<span>${cfg.name}</span><span>➔</span>`;
                li.addEventListener('click', () => { if(currentMode === "explore" && !tourActive) jumpToDestination(cfg.id); });
                list.appendChild(li);

                // Landmark Labels setup mapping overlay references dynamically
                const lbl = document.createElement('div');
                lbl.className = 'spatial-label'; lbl.innerText = cfg.name;
                lbl.id = `label-${cfg.id}`;
                lbl.addEventListener('click', () => { if(currentMode === "explore" && !tourActive) jumpToDestination(cfg.id); });
                labelsContainer.appendChild(lbl);
            });

            const exploreBtn = document.getElementById('btn-mode-explore');
            const tourBtn = document.getElementById('btn-mode-tour');
            const yachtBtn = document.getElementById('btn-mode-yacht');
            const navPanel = document.getElementById('landmark-panel');
            const infoCard = document.getElementById('info-card');
            const closeBtn = document.getElementById('card-close');
            
            // Dynamic controls array elements selectors
            const pauseBtn = document.getElementById('btn-tour-pause');
            const prevBtn = document.getElementById('btn-tour-prev');
            const nextBtn = document.getElementById('btn-tour-next');
            const muteBtn = document.getElementById('btn-tour-mute');
            const exitBtn = document.getElementById('btn-tour-exit');

            function toggleTourControlsDOM(show) {
                document.querySelectorAll('.tour-ctrl').forEach(el => el.style.display = show ? 'inline-block' : 'none');
            }

            exploreBtn.addEventListener('click', () => {
                currentMode = "explore"; tourActive = false; tourPaused = false; returningToTour = false;
                exploreBtn.classList.add('active'); tourBtn.classList.remove('active'); yachtBtn.classList.remove('active');
                navPanel.style.display = "flex"; infoCard.style.display = "none";
                toggleTourControlsDOM(false); closeBtn.style.display = '';
                controls.enabled = true; controls.target.copy(currentLookAt); controls.update();
                isInterpolating = false; setAudioPlayback(false);
                yachtBowGroup.visible = false;
            });

            tourBtn.addEventListener('click', () => {
                currentMode = "tour"; tourBtn.classList.add('active'); exploreBtn.classList.remove('active'); yachtBtn.classList.remove('active');
                navPanel.style.display = "none"; toggleTourControlsDOM(true); closeBtn.style.display = 'none';
                pauseBtn.innerText = "Pause"; controls.enabled = false;
                activeTourType = 'heli';
                tourTime = 0; tourActive = true; tourPaused = false; returningToTour = false; isInterpolating = true;
                targetCamPos.copy(tourSpline.getPointAt(0)); targetLookAt.copy(splineLookTargets[0]);
                setAudioPlayback(true);
                yachtBowGroup.visible = false;

                const firstLandmark = LANDMARKS_CONFIG[0]; activeId = firstLandmark.id;
                document.getElementById('card-title').innerText = firstLandmark.name;
                formatShortenedTextDescription(firstLandmark);
                infoCard.style.display = 'flex'; infoCard.classList.remove('pos-left'); infoCard.classList.add('pos-right');
            });

            yachtBtn.addEventListener('click', () => {
                currentMode = "tour"; yachtBtn.classList.add('active'); exploreBtn.classList.remove('active'); tourBtn.classList.remove('active');
                navPanel.style.display = "none"; toggleTourControlsDOM(true); closeBtn.style.display = 'none';
                pauseBtn.innerText = "Pause"; controls.enabled = false;
                activeTourType = 'yacht';
                tourTime = 0; yachtDirection = 1; tourActive = true; tourPaused = false; returningToTour = false; isInterpolating = true;
                targetCamPos.copy(yachtSpline.getPointAt(0)); targetLookAt.copy(yachtLookTargets[0]);
                setAudioPlayback(true);
                yachtBowGroup.visible = true;

                const firstLandmark = YACHT_ROUTE_CFGS[0]; activeId = firstLandmark.id;
                document.getElementById('card-title').innerText = firstLandmark.name;
                formatShortenedTextDescription(firstLandmark);
                infoCard.style.display = 'flex'; infoCard.classList.remove('pos-left'); infoCard.classList.add('pos-right');
            });

            pauseBtn.addEventListener('click', () => {
                if (!tourActive) return;
                if (!tourPaused) {
                    tourPaused = true; returningToTour = false; pausedTourTime = tourTime;
                    savedTourPosition.copy(camera.position); savedTourLookTarget.copy(currentLookAt);
                    controls.enabled = true; controls.target.copy(currentLookAt);
                    setAudioPlayback(false); pauseBtn.innerText = "Resume";
                } else {
                    controls.enabled = false; returningToTour = true;
                    targetCamPos.copy(savedTourPosition); targetLookAt.copy(savedTourLookTarget);
                    setAudioPlayback(true); pauseBtn.innerText = "Pause";
                }
            });

            // Operational Tour Core Controls Listeners
            prevBtn.addEventListener('click', () => {
                if (!tourActive) return;
                // Yacht's route is non-closed and ping-pongs; wrapping with modulo here would
                // reintroduce the same awkward jump this turn fixes for the end-of-route loop.
                tourTime = activeTourType === 'yacht' ? Math.max(0, tourTime - (3 / 15)) : (tourTime - (3 / 15) + 1.0) % 1.0;
                tourPaused = false; returningToTour = false; isInterpolating = true;
            });
            nextBtn.addEventListener('click', () => {
                if (!tourActive) return;
                tourTime = activeTourType === 'yacht' ? Math.min(1, tourTime + (3 / 15)) : (tourTime + (3 / 15)) % 1.0;
                tourPaused = false; returningToTour = false; isInterpolating = true;
            });
            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted; muteBtn.innerText = isMuted ? "Unmute" : "Mute";
                // returningToTour counts as playing: during the resume fly-back tourPaused is
                // still true until the camera reaches the path, so without this an unmute in
                // that window would never restart the audio (Resume itself starts audio during
                // the same fly-back, so this keeps the two controls consistent).
                setAudioPlayback(!isMuted && tourActive && (!tourPaused || returningToTour));
            });
            exitBtn.addEventListener('click', () => exploreBtn.click());

            // "Close details": stops propagation so the click can never also trigger the
            // mobile card's own expand/collapse toggle listener below, cancels any in-flight
            // fly-to camera motion, and fully resets expand/active state. Hidden during tours
            // (see toggleTourControlsDOM/closeBtn.style.display above) since tour cards persist.
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (tourActive) return;
                infoCard.style.display = 'none';
                infoCard.classList.remove('expanded');
                fullDescriptionExpanded = false;
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                activeId = null;
                isInterpolating = false;
            });

            // Mobile: card shows only the title by default; tap anywhere on it (except
            // Close/Read more) to expand or collapse the description. Never auto-expands.
            infoCard.addEventListener('click', (e) => {
                if (window.innerWidth > 768) return;
                if (e.target.closest('#card-close') || e.target.closest('.read-more-toggle')) return;
                infoCard.classList.toggle('expanded');
            });
            
            // Collapsible Bottom Sheet trigger engine allocation mapping
            const sheetTrigger = document.getElementById('sheet-trigger');
            sheetTrigger.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    navPanel.classList.toggle('expanded');
                }
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta(); const timeElapsed = clock.getElapsedTime();

            if (currentMode === "explore") {
                if (isInterpolating) {
                    camera.position.lerp(targetCamPos, 4.0 * delta); currentLookAt.lerp(targetLookAt, 4.0 * delta);
                    controls.target.copy(currentLookAt); camera.lookAt(currentLookAt);
                    if (camera.position.distanceTo(targetCamPos) < 0.25 && currentLookAt.distanceTo(targetLookAt) < 0.25) {
                        isInterpolating = false; controls.target.copy(targetLookAt); 
                    }
                }
                controls.target.x = THREE.MathUtils.clamp(controls.target.x, -2200, 2200);
                controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 800); 
                controls.target.z = THREE.MathUtils.clamp(controls.target.z, -1800, 1800);
                controls.update(); if (!isInterpolating) currentLookAt.copy(controls.target);
            } 
            else if (currentMode === "tour" && tourActive) {
                if (tourPaused) {
                    if (returningToTour) {
                        camera.position.lerp(targetCamPos, 3.5 * delta); currentLookAt.lerp(targetLookAt, 3.5 * delta);
                        camera.lookAt(currentLookAt); controls.target.copy(currentLookAt);
                        if (camera.position.distanceTo(targetCamPos) < 0.3 && currentLookAt.distanceTo(targetLookAt) < 0.3) {
                            returningToTour = false; tourPaused = false; tourTime = pausedTourTime; 
                        }
                    } else {
                        controls.target.x = THREE.MathUtils.clamp(controls.target.x, -2200, 2200);
                        controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 800);
                        controls.target.z = THREE.MathUtils.clamp(controls.target.z, -1800, 1800);
                        controls.update(); camera.lookAt(controls.target); currentLookAt.copy(controls.target);
                    }
                } else if (isInterpolating) {
                    camera.position.lerp(targetCamPos, 2.5 * delta); currentLookAt.lerp(targetLookAt, 2.5 * delta);
                    camera.lookAt(currentLookAt);
                    if (camera.position.distanceTo(targetCamPos) < 2.0) isInterpolating = false;
                } else {
                    const isYacht = activeTourType === 'yacht';

                    if (isYacht) {
                        // Non-closed spline: ping-pong instead of wrapping or restarting. Wrapping
                        // with modulo would cut a diagonal shortcut across the map; snapping back to
                        // the start reads as an awkward jump. Reversing direction in place at each
                        // end is smooth by construction — position never jumps, only the direction
                        // of travel flips — and the boat simply retraces the same safe coastal path.
                        tourTime += yachtDirection * (delta / YACHT_TOUR_DURATION);
                        if (tourTime >= 1.0) { tourTime = 1.0; yachtDirection = -1; }
                        else if (tourTime <= 0.0) { tourTime = 0.0; yachtDirection = 1; }

                        const segCount = yachtLookTargets.length - 1;
                        const segmentProgress = tourTime * segCount;
                        const baseIndex = Math.min(Math.max(Math.floor(segmentProgress), 0), segCount - 1);
                        const nextIndex = Math.min(baseIndex + 1, segCount);
                        const segmentAlpha = segmentProgress - baseIndex;

                        const rawSplinePos = yachtSpline.getPointAt(tourTime);
                        const interpolatedSplineLook = new THREE.Vector3().lerpVectors(yachtLookTargets[baseIndex], yachtLookTargets[nextIndex], segmentAlpha);

                        // Slow, gentle bob + sway on the water (distinct from the heli's fast engine vibration below).
                        const motionOffset = new THREE.Vector3(Math.sin(timeElapsed * 0.7) * 0.6, Math.sin(timeElapsed * 1.1) * 0.9 + 0.3, Math.cos(timeElapsed * 0.5) * 0.4);
                        camera.position.copy(rawSplinePos).add(motionOffset);
                        currentLookAt.lerp(interpolatedSplineLook, 3.0 * delta); camera.lookAt(currentLookAt); // always looking inland at the current landmark

                        const yachtLandmarkId = yachtLookIds[baseIndex];
                        if (activeId !== yachtLandmarkId) {
                            activeId = yachtLandmarkId;
                            const cfg = LANDMARKS_CONFIG.find(c => c.id === yachtLandmarkId);
                            document.getElementById('card-title').innerText = cfg.name;
                            formatShortenedTextDescription(cfg);
                        }
                    } else {
                        tourTime += (delta / HELI_TOUR_DURATION);
                        // Closed spline (Helicopter Tour): always normalise into [0,1) — a single
                        // "if" subtraction could leave tourTime > 1 after a large delta spike (tab
                        // backgrounded, mobile jank), which used to feed CatmullRomCurve3.getPointAt(u>1)
                        // and throw inside three.js's arc-length lookup. See prior QA notes.
                        tourTime = ((tourTime % 1.0) + 1.0) % 1.0;

                        const segmentProgress = tourTime * 15;
                        const baseIndex = Math.floor(segmentProgress) % 15;
                        const nextIndex = (baseIndex + 1) % 15; const segmentAlpha = segmentProgress - Math.floor(segmentProgress);

                        const rawSplinePos = tourSpline.getPointAt(tourTime);
                        const interpolatedSplineLook = new THREE.Vector3().lerpVectors(splineLookTargets[baseIndex], splineLookTargets[nextIndex], segmentAlpha);

                        // Smooth, slow altitude swell (gentle rise/fall) plus a faint high-frequency
                        // texture for engine feel — much smaller amplitude than before so it reads
                        // as vibration, not shaking or a sudden jump.
                        const altitudeSwell = Math.sin(timeElapsed * 0.35) * 6.0;
                        const microJitter = new THREE.Vector3(Math.cos(timeElapsed * 1.8) * 0.15, Math.sin(timeElapsed * 2.2) * 0.2, 0);
                        camera.position.copy(rawSplinePos).add(microJitter);
                        camera.position.y += altitudeSwell;
                        currentLookAt.lerp(interpolatedSplineLook, 3.0 * delta);

                        // Subtle banking into turns: sample the spline's tangent a moment ahead to
                        // estimate turn direction/rate, then ease the roll toward a small target
                        // angle — currentBank only ever moves a fraction of the way there each
                        // frame, so it can never snap or jump even on a sharp turn.
                        const tangentNow = tourSpline.getTangentAt(tourTime);
                        const tangentAhead = tourSpline.getTangentAt(((tourTime + 0.004) % 1.0 + 1.0) % 1.0);
                        const turnAmount = tangentNow.x * tangentAhead.z - tangentNow.z * tangentAhead.x; // signed turn rate
                        const bankTarget = THREE.MathUtils.clamp(turnAmount * 45, -0.11, 0.11);
                        currentBank += (bankTarget - currentBank) * 2.5 * delta;
                        camera.up.set(Math.sin(currentBank), Math.cos(currentBank), 0);
                        camera.lookAt(currentLookAt);
                        camera.up.set(0, 1, 0); // reset so Explore/OrbitControls/Yacht are never affected

                        const currentLandmarkIndex = Math.floor(segmentProgress / 3) % LANDMARKS_CONFIG.length;
                        const matchedLandmarkNode = LANDMARKS_CONFIG[currentLandmarkIndex];

                        if (matchedLandmarkNode.id === "moft") {
                            const raycaster = new THREE.Raycaster();
                            const dir = new THREE.Vector3().subVectors(matchedLandmarkNode.runtimeGroup.position, camera.position).normalize();
                            raycaster.set(camera.position, dir);
                            const blocksIntersections = raycaster.intersectObject(backgroundMeshInstance);
                            if(blocksIntersections.length > 0 && blocksIntersections[0].distance < camera.position.distanceTo(matchedLandmarkNode.runtimeGroup.position)) {
                                camera.position.y += 28 * delta; 
                            }
                        }

                        if (activeId !== matchedLandmarkNode.id) {
                            activeId = matchedLandmarkNode.id;
                            document.getElementById('card-title').innerText = matchedLandmarkNode.name;
                            formatShortenedTextDescription(matchedLandmarkNode);
                        }
                    }
                }
            }

            // --- SPATIAL LABEL COORDINATE PIN DRAW OVERLAYS ---
            const tempV = new THREE.Vector3();
            LANDMARKS_CONFIG.forEach(cfg => {
                const labelEl = document.getElementById(`label-${cfg.id}`);
                if (!labelEl) return;
                
                if (currentMode === "tour" && tourActive) {
                    labelEl.style.display = 'none'; // Clear pins out completely inside automated cinematic flights
                    return;
                }

                tempV.set(cfg.pos[0], cfg.pos[1] + cfg.lblOffset, cfg.pos[2]);
                tempV.project(camera);

                // Cull pins resting completely outside projection frustum view parameters
                if (Math.abs(tempV.x) > 1 || Math.abs(tempV.y) > 1 || tempV.z > 1) {
                    labelEl.style.display = 'none';
                } else {
                    labelEl.style.display = 'block';
                    labelEl.style.left = `${(tempV.x + 1) * window.innerWidth / 2}px`;
                    labelEl.style.top = `${(-tempV.y + 1) * window.innerHeight / 2}px`;
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
